name: ci-native

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GNAT
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnat
      - name: Ada compile proof
        run: make compiler-proof
      - name: Deterministic adapter tests
        run: make test
