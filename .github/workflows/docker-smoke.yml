name: docker-smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t ada-stakeholder .
      - name: Registry smoke
        run: docker run --rm ada-stakeholder --list-values | grep -F '"generatorFamilies"'
      - name: Dedicated family smoke
        run: docker run --rm ada-stakeholder --output-format json --focus-family code_analyzer --seed alpha | grep -F '"rendererKey":"classic-six.code_analyzer"'
      - name: Same-seed stability
        run: |
          docker run --rm ada-stakeholder --output-format json --focus-family platform-engineering --seed stable > /tmp/a.json
          docker run --rm ada-stakeholder --output-format json --focus-family platform_engineering --seed stable > /tmp/b.json
          diff -u /tmp/a.json /tmp/b.json
      - name: Experimental provider fail-fast
        run: |
          if docker run --rm ada-stakeholder --experimental-provider local-demo > /tmp/provider.out 2> /tmp/provider.err; then
            echo "experimental provider unexpectedly succeeded" >&2
            exit 1
          fi
          grep -F 'experimental provider' /tmp/provider.err
