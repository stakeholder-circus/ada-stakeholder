name: sast

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ada-compile-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install GNAT
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnat
      - name: Compile-check Ada contract
        run: |
          mkdir -p build/ada
          gnatmake -gnatc -D build/ada src/stakeholder_registry.ads
      - name: Compile-check Python adapter
        run: python3 -m py_compile bin/stakeholder.py
